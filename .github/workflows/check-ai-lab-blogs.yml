name: Check AI Lab Blogs for New Releases

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  check-blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter new articles from RSS feeds
        id: filter
        run: python scripts/filter-new-articles.py

      - name: Check new articles for model releases
        if: steps.filter.outputs.has_new_articles == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You classify new AI lab articles as model releases. Do not edit any data file — a Python step merges your output.

            Step 1: Read site/ai-race/data/tracked-models.json — valid company ids, their names, and the models already tracked.

            Step 2: Read site/ai-race/data/new-articles.json — new, unprocessed articles from AI lab RSS feeds.
            Each entry has a title, url, date, description, and source.

            Step 3: Identify which articles announce a new AI model, based on the title.
            A model release is a new model version you can call via API or use in a product (e.g. "GPT-5.4", "Gemini 3.2 Pro", "Claude Opus 5").
            Do NOT include: feature updates, API/platform changes, research papers, safety reports, product launches, partnership announcements, or tool/app announcements.
            Skip any model already listed in tracked-models.json.
            If a single article announces multiple models (e.g. "mini and nano"), emit a separate entry for each model.

            Step 4: Write site/ai-race/data/detected-releases.json — a JSON array (write [] if nothing qualifies). Each entry:
            - "company_id": the matching key from tracked-models.json
            - "name": the model name as marketed, e.g. "Claude Opus 5"
            - "date": the date from the RSS entry (already in YYYY-MM-DD format)
            - "tier": "flagship" for new model generations or major capability leaps, "major" for significant updates or new model sizes, "minor" for incremental iterations
            - "description": under 200 characters, based on the RSS description and your knowledge of the model
            - "url": the article URL from the RSS entry

            Write only that file, then report what you detected.
          settings: |
            {
              "permissions": {
                "allow": ["Read", "Write"]
              }
            }
          # Pin the model: the action's default drifts over time (it had moved to
          # claude-opus-5[1m], the priciest option) and this job only classifies
          # RSS titles, so Sonnet is ample and much cheaper per run.
          claude_args: "--max-turns 6 --model claude-sonnet-5"

      - name: Merge detected releases into ai-releases.json
        if: steps.filter.outputs.has_new_articles == 'true'
        run: python scripts/merge-detected-releases.py

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ai-race/data/ai-releases.json site/ai-race/data/checked-blog-urls.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update AI releases from lab blogs ($(date -u '+%Y-%m-%d'))"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml

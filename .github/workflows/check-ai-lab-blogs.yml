name: Check AI Lab Blogs for New Releases

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  check-blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter new articles from RSS feeds
        id: filter
        run: python scripts/filter-new-articles.py

      - name: Check new articles for model releases
        if: steps.filter.outputs.has_new_articles == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are checking new AI lab articles for model releases to update site/ai-race/data/ai-releases.json.

            Step 1: Read site/ai-race/data/ai-releases.json to see all currently tracked releases.

            Step 2: Read site/ai-race/data/new-articles.json — it contains new, unprocessed articles from AI lab RSS feeds.
            Each entry has a title, url, date, description, and source.

            Step 3: Identify which articles are new AI model releases based on the title.
            A model release is a new model version you can call via API or use in a product (e.g. "GPT-5.4", "Gemini 3.2 Pro", "Claude Opus 5").
            Do NOT include: feature updates, API/platform changes, research papers, safety reports, product launches, partnership announcements, or tool/app announcements.
            If a single article announces multiple models (e.g. "mini and nano"), add a separate entry for each model.

            Step 4: For any genuinely new model NOT already tracked:
            - Add to the correct company's releases array in chronological order
            - "date": use the date from the RSS entry (already in YYYY-MM-DD format)
            - "description": write a concise description under 200 characters using the RSS description and your knowledge of the model
            - "tier": "flagship" for new model generations or major capability leaps, "major" for significant updates or new model sizes, "minor" for incremental iterations
            - "url": the article URL from the RSS entry
            - Do NOT add a model if an entry with the same name already exists

            Step 5: Update "last_updated" to today's date (YYYY-MM-DD format).

            Step 6: Save the file if any changes were made. Report what you added, or confirm no new releases were found.
          show_full_output: true
          claude_args: "--max-turns 15"

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ai-race/data/ai-releases.json site/ai-race/data/checked-blog-urls.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update AI releases from lab blogs ($(date -u '+%Y-%m-%d'))"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml

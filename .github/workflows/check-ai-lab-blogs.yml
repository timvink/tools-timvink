name: Check AI Lab Blogs for New Releases

on:
  schedule:
    # Run weekly, Mondays at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  models: read
  actions: write

jobs:
  check-blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter new articles from RSS feeds
        id: filter
        run: python scripts/filter-new-articles.py

      # Inference runs on GitHub Models, which is free for GITHUB_TOKEN under the
      # `models: read` permission — no API key and no per-run cost.
      - name: Classify new articles for model releases
        if: steps.filter.outputs.has_new_articles == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/classify-releases.py

      - name: Merge detected releases into ai-releases.json
        if: steps.filter.outputs.has_new_articles == 'true'
        run: python scripts/merge-detected-releases.py

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ai-race/data/ai-releases.json site/ai-race/data/checked-blog-urls.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update AI releases from lab blogs ($(date -u '+%Y-%m-%d'))"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml

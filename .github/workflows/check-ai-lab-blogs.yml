name: Check AI Lab Blogs for New Releases

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check lab blogs for new releases
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are checking AI lab blogs for new model releases to update site/ai-race/data/ai-releases.json.

            Step 1: Read site/ai-race/data/ai-releases.json to see all currently tracked releases.

            Step 2: Fetch each of these blog pages to find recent model release announcements.
            To fetch content, prepend https://markdown.new/ to each URL for clean markdown.

            Blogs to check:
            - OpenAI: https://openai.com/research/index/release/
            - Google DeepMind: https://blog.google/innovation-and-ai/models-and-research/gemini-models/
            - Anthropic: https://www.anthropic.com/news

            Step 3: Identify ONLY new AI model releases. A model release is a new model version you can call via API or use in a product (e.g. "GPT-5.4", "Gemini 3.2 Pro", "Claude Opus 5").
            Do NOT include: feature updates, API/platform changes, research papers, safety reports, product launches, partnership announcements, or tool/app announcements.

            Step 4: Compare against existing releases in ai-releases.json. For any genuinely new model NOT already tracked:
            - Add to the correct company's releases array in chronological order
            - "date": announcement date in YYYY-MM-DD format
            - "description": under 200 characters summarizing the model's key capability
            - "tier": "flagship" for new model generations or major capability leaps, "major" for significant updates or new model sizes, "minor" for incremental iterations
            - "url": the announcement URL (link to the specific blog post, not the blog index)
            - Do NOT add a model if an entry with the same name already exists

            Step 5: Update "last_updated" to today's date (YYYY-MM-DD format).

            Step 6: Save the file if any changes were made. Report what you added, or confirm no new releases were found.
          claude_args: "--max-turns 15"

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ai-race/data/ai-releases.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update AI releases from lab blogs ($(date -u '+%Y-%m-%d'))"
            git push
          fi

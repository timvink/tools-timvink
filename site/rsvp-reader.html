<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Reader - RSVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: {
                            50: '#fdfbf7',
                            100: '#f7f1e3', // Classic warm beige
                            200: '#efdec2',
                            300: '#e6c8a0',
                            800: '#4a4036', // Ink color
                            900: '#2c241b',
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        body: ['"Lora"', 'serif'],
                        mono: ['"Source Code Pro"', 'monospace'],
                    },
                    boxShadow: {
                        'paper': '0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24), 2px 4px 12px rgba(0,0,0,0.05)',
                        'inner-paper': 'inset 0 2px 4px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar to match the theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f7f1e3;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c5a9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c4b599;
        }

        /* The alignment reticles */
        .reticle-top, .reticle-bottom {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background-color: #cbd5e1; /* Slate 300 */
        }
        .reticle-top { top: 0; }
        .reticle-bottom { bottom: 0; }
    </style>
</head>
<body class="bg-paper-100 text-paper-900 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-orange-200 selection:text-paper-900 font-body">

    <!-- Main Card -->
    <main class="w-full max-w-2xl bg-paper-50 shadow-paper rounded-sm border border-paper-200 overflow-hidden relative">
        
        <!-- Header -->
        <header class="bg-paper-200/50 border-b border-paper-200 p-6 flex justify-between items-center">
            <h1 class="font-serif text-3xl font-semibold text-paper-900 tracking-wide">Rapid Reader</h1>
            <div class="text-xs font-mono text-paper-800 uppercase tracking-widest opacity-60">Vol. 1</div>
        </header>

        <!-- Input Mode (Visible by default) -->
        <div id="input-view" class="p-8 transition-opacity duration-300">
            <div class="mb-6">
                <label for="text-input" class="block text-sm font-serif italic text-paper-800 mb-2">Paste your text below to begin reading...</label>
                <textarea 
                    id="text-input" 
                    class="w-full h-64 bg-transparent border-b-2 border-paper-200 resize-none focus:outline-none focus:border-orange-400 text-lg leading-relaxed p-2 font-body placeholder-paper-300 transition-colors"
                    placeholder="In a hole in the ground there lived a hobbit. Not a nasty, dirty, wet hole, filled with the ends of worms and an oozy smell, nor yet a dry, bare, sandy hole with nothing in it to sit down on or to eat: it was a hobbit-hole, and that means comfort..."
                ></textarea>
            </div>

            <div class="flex flex-col sm:flex-row gap-6 items-center justify-between border-t border-paper-200 pt-6">
                <div class="flex items-center gap-4">
                    <label class="text-sm font-serif font-semibold text-paper-800">Speed (WPM)</label>
                    <div class="flex items-center bg-paper-100 rounded px-2 py-1 shadow-inner-paper">
                        <button onclick="adjustWpm(-25)" class="text-paper-800 hover:text-orange-600 px-2 font-mono">-</button>
                        <input type="number" id="wpm-input" value="250" class="w-16 bg-transparent text-center font-mono focus:outline-none" onchange="updateWpm(this.value)">
                        <button onclick="adjustWpm(25)" class="text-paper-800 hover:text-orange-600 px-2 font-mono">+</button>
                    </div>
                </div>
                
                <button onclick="startReader()" class="bg-paper-900 text-paper-50 px-8 py-3 font-serif text-lg hover:bg-orange-900 transition-colors shadow-lg active:transform active:scale-95">
                    Start Reading
                </button>
            </div>
        </div>

        <!-- Reader Mode (Hidden by default) -->
        <div id="reader-view" class="hidden flex-col h-[500px]">
            
            <!-- Progress Bar -->
            <div class="h-1 bg-paper-200 w-full">
                <div id="progress-bar" class="h-full bg-orange-500 w-0 transition-all duration-200"></div>
            </div>

            <!-- Reading Area -->
            <div class="flex-1 flex flex-col items-center justify-center relative bg-paper-50" onclick="togglePause()">
                
                <!-- The Word Display -->
                <!-- We use flexbox alignment to ensure the Pivot is perfectly centered -->
                <div class="w-full max-w-3xl h-32 flex items-center justify-center relative px-4">
                    
                    <!-- Top/Bottom Reticles for visual anchoring -->
                    <div class="reticle-top"></div>
                    <div class="reticle-bottom"></div>

                    <!-- The Container for the split word -->
                    <div class="flex items-baseline w-full text-5xl md:text-6xl font-mono text-paper-900 leading-none select-none cursor-pointer">
                        
                        <!-- Left side (aligns right towards center) -->
                        <span id="word-prefix" class="flex-1 text-right text-paper-800"></span>
                        
                        <!-- The Pivot (Fixed Center) -->
                        <!-- Highlighting in a reddish orange typical of RSVP apps -->
                        <span id="word-pivot" class="text-orange-600 font-semibold mx-0.5 transform -translate-y-0.5"></span>
                        
                        <!-- Right side (aligns left away from center) -->
                        <span id="word-suffix" class="flex-1 text-left text-paper-800"></span>
                    </div>

                </div>

                <div class="mt-8 text-paper-300 text-sm font-serif italic" id="status-msg">Click to pause</div>
            </div>

            <!-- Controls -->
            <div class="bg-paper-100 p-4 border-t border-paper-200 flex items-center justify-between">
                <div class="text-sm font-mono text-paper-800 w-24">
                    <span id="current-word-idx">0</span> / <span id="total-words">0</span>
                </div>

                <div class="flex items-center gap-4">
                    <button onclick="rewind(10)" class="p-2 hover:bg-paper-200 rounded-full transition-colors text-paper-800" title="Back 10 words">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
                    </button>

                    <button id="play-pause-btn" onclick="togglePause()" class="w-12 h-12 flex items-center justify-center bg-paper-900 text-paper-50 rounded-full hover:bg-orange-900 transition-all shadow-md">
                        <!-- Play Icon -->
                        <svg id="icon-play" class="hidden ml-1" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <!-- Pause Icon -->
                        <svg id="icon-pause" class="" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>

                    <button onclick="stopReader()" class="p-2 hover:bg-paper-200 rounded-full transition-colors text-paper-800" title="Stop & Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                    </button>
                </div>

                <!-- Live WPM Adjuster -->
                <div class="flex items-center gap-2 w-24 justify-end">
                     <span class="text-xs font-mono text-paper-800 opacity-50">WPM</span>
                     <input type="number" id="wpm-reader-input" value="250" class="w-14 bg-transparent text-right font-mono focus:outline-none border-b border-transparent hover:border-paper-300 focus:border-orange-400" onchange="updateWpm(this.value)">
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- State ---
        let words = [];
        let currentIndex = 0;
        let isRunning = false;
        let wpm = 250;
        let timer = null;

        // --- DOM Elements ---
        const inputView = document.getElementById('input-view');
        const readerView = document.getElementById('reader-view');
        const textInput = document.getElementById('text-input');
        
        const elPrefix = document.getElementById('word-prefix');
        const elPivot = document.getElementById('word-pivot');
        const elSuffix = document.getElementById('word-suffix');
        
        const elProgress = document.getElementById('progress-bar');
        const elCurrentIdx = document.getElementById('current-word-idx');
        const elTotalWords = document.getElementById('total-words');
        const elStatusMsg = document.getElementById('status-msg');
        
        const btnPlayPause = document.getElementById('play-pause-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        
        const inputWpmMain = document.getElementById('wpm-input');
        const inputWpmReader = document.getElementById('wpm-reader-input');

        // --- Core Logic: Optimal Recognition Point (ORP) ---
        // Determines which character index should be centered based on word length.
        function getORPIndex(word) {
            const len = word.length;
            if (len === 1) return 0; // "a" -> center 'a'
            if (len >= 2 && len <= 5) return 1; // "the" -> center 'h'
            if (len >= 6 && len <= 9) return 2; // "reader" -> center 'a'
            if (len >= 10 && len <= 13) return 3; // "university" -> center 'v'
            return 4; // very long words
        }

        function calculateDelay(word) {
            // Base delay per word in ms
            const baseDelay = 60000 / wpm;
            let delay = baseDelay;

            // Logic: Pause longer on punctuation to allow cognitive processing
            const lastChar = word.slice(-1);
            if (lastChar === '.') delay = baseDelay * 2.5; 
            else if (lastChar === ',' || lastChar === ';' || lastChar === ':') delay = baseDelay * 1.5;
            else if (word.length > 8) delay = baseDelay * 1.2; // slight slow down for long words
            
            return delay;
        }

        // --- Control Functions ---

        function startReader() {
            const rawText = textInput.value.trim();
            if (!rawText) return;

            // Simple split by whitespace, preserving some punctuation logic attached to words
            words = rawText.split(/\s+/).filter(w => w.length > 0);
            
            if (words.length === 0) return;

            // Reset state
            currentIndex = 0;
            elTotalWords.innerText = words.length;
            
            // Switch UI
            inputView.classList.add('hidden');
            readerView.classList.remove('hidden');
            readerView.classList.add('flex');
            
            setIsRunning(true);
            renderWord();
            scheduleNext();
        }

        function stopReader() {
            setIsRunning(false);
            clearTimeout(timer);
            
            // Switch UI back
            readerView.classList.remove('flex');
            readerView.classList.add('hidden');
            inputView.classList.remove('hidden');
        }

        function togglePause() {
            setIsRunning(!isRunning);
            if (isRunning) {
                scheduleNext();
            } else {
                clearTimeout(timer);
            }
        }

        function setIsRunning(state) {
            isRunning = state;
            if (isRunning) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                elStatusMsg.innerText = "Click to pause";
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                elStatusMsg.innerText = "Paused";
            }
        }

        function rewind(amount) {
            currentIndex = Math.max(0, currentIndex - amount);
            renderWord();
            // If paused, stay paused. If running, it continues from new spot automatically on next tick,
            // but for immediate feedback we clear timer and restart logic if running
            if (isRunning) {
                clearTimeout(timer);
                scheduleNext();
            }
        }

        function updateWpm(val) {
            wpm = parseInt(val);
            if (wpm < 50) wpm = 50;
            if (wpm > 1000) wpm = 1000;
            
            // Sync inputs
            inputWpmMain.value = wpm;
            inputWpmReader.value = wpm;
        }

        function adjustWpm(delta) {
            updateWpm(parseInt(wpm) + delta);
        }

        // --- Render Loop ---

        function renderWord() {
            if (currentIndex >= words.length) {
                stopReader();
                return;
            }

            const word = words[currentIndex];
            const orpIndex = getORPIndex(word);

            // Split word
            const prefix = word.substring(0, orpIndex);
            const pivot = word.substring(orpIndex, orpIndex + 1);
            const suffix = word.substring(orpIndex + 1);

            // Update DOM
            elPrefix.innerText = prefix;
            elPivot.innerText = pivot;
            elSuffix.innerText = suffix;

            // Update Stats
            elCurrentIdx.innerText = currentIndex + 1;
            const progressPct = ((currentIndex + 1) / words.length) * 100;
            elProgress.style.width = `${progressPct}%`;
        }

        function scheduleNext() {
            if (!isRunning) return;
            if (currentIndex >= words.length) {
                setIsRunning(false);
                return;
            }

            const currentWord = words[currentIndex];
            const delay = calculateDelay(currentWord);

            timer = setTimeout(() => {
                currentIndex++;
                if (currentIndex < words.length) {
                    renderWord();
                    scheduleNext();
                } else {
                    stopReader(); // Finished
                }
            }, delay);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (readerView.classList.contains('hidden')) return; // Only active in reader mode

            if (e.code === 'Space') {
                e.preventDefault();
                togglePause();
            } else if (e.code === 'ArrowLeft') {
                rewind(10);
            } else if (e.code === 'ArrowRight') {
                // Forward logic (manual step)
                if(!isRunning) {
                    currentIndex = Math.min(words.length -1, currentIndex + 1);
                    renderWord();
                }
            } else if (e.code === 'ArrowUp') {
                adjustWpm(25);
            } else if (e.code === 'ArrowDown') {
                adjustWpm(-25);
            }
        });

    </script>
</body>
</html>
